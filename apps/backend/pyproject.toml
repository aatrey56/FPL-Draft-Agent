[project]
name = "fpl-backend"
version = "0.2.0"
description = "FPL Draft co-pilot — ML pipeline and decision artifacts"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "anthropic>=1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
