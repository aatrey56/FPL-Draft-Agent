[project]
name = "fpl-backend"
version = "0.2.0"
description = "FPL Draft co-pilot — ML pipeline, decision artifacts, and the legacy chat backend"
requires-python = ">=3.11"
dependencies = [
    # ML / data pipeline (the core)
    "pandas>=2.2",
    "pyarrow>=15",
    "requests==2.32.5",
    "python-dotenv==1.2.3",
    # Legacy chat stack (deprecated but kept compiling/tested — see CLAUDE.md §2.1)
    "fastapi==0.141.1",
    "uvicorn[standard]==0.42.0",
    "apscheduler==3.11.3",
    "openai==1.63.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
